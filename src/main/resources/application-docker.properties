# docker-compose 환경 전용 오버라이드. dev 프로필(application.properties)은 그대로 유지.
spring.datasource.url=jdbc:mysql://mysql:3306/daall_coffee?characterEncoding=UTF-8

spring.data.redis.host=redis
spring.data.redis.port=6379

# 스키마는 mysqldump로 관리(db-seed/seed.sql). Hibernate는 검증만 하고 스키마를 직접 바꾸지 않음.
spring.jpa.hibernate.ddl-auto=validate

file.upload.path=/data/dacoffee/files

cookie.domain=.daallcoffee.com
