# docker-compose 환경 전용 오버라이드. dev 프로필(application.properties)은 그대로 유지.
spring.datasource.url=jdbc:mysql://mysql:3306/da_coffee?characterEncoding=UTF-8

spring.data.redis.host=redis
spring.data.redis.port=6379

# 로컬 검증용: 엔티티 기준으로 테이블 자동 생성 (실제 배포 시 mysqldump로 교체 예정)
spring.jpa.hibernate.ddl-auto=update

file.upload.path=/data/dacoffee/files
